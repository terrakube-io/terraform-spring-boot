name: Publish package to the Maven Central Repository
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'liberica'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Pin Maven to 3.9.16
        run: |
          set -euo pipefail
          BASE_URL=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries
          ARCHIVE=apache-maven-3.9.16-bin.tar.gz
          curl -fsS -L -o "/tmp/$ARCHIVE" "$BASE_URL/$ARCHIVE"
          curl -fsS -L -o "/tmp/$ARCHIVE.sha512" "$BASE_URL/$ARCHIVE.sha512"
          # The .sha512 file may hold only the hash, so rebuild the "<hash>  <file>" line
          echo "$(awk '{print $1}' "/tmp/$ARCHIVE.sha512")  /tmp/$ARCHIVE" | sha512sum -c -
          tar -xz -C /tmp -f "/tmp/$ARCHIVE"
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn --version
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      - name: Update POM Version
        run: mvn versions:set-property -Dproperty=revision -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Publish to the Maven Central Repository
        run: mvn --batch-mode clean deploy
        env:
          MAVEN_USERNAME:  ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD:  ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE:  ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}